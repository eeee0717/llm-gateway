# 本地依赖：网关和测试都连这一套。数据库口令是本地开发用的固定值，不是密钥。
# 端口只绑在回环地址上，同一个网络里的其他机器连不到这两个没设防的服务。
services:
  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_USER: gateway
      POSTGRES_PASSWORD: gateway
      POSTGRES_DB: gateway
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      # PG 18 起数据目录在 /var/lib/postgresql 下按主版本号分子目录，卷要挂在上一层
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gateway -d gateway"]
      interval: 2s
      timeout: 3s
      retries: 15

  redis:
    image: redis:8-alpine
    ports:
      - "127.0.0.1:6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 3s
      retries: 15

volumes:
  pgdata:
