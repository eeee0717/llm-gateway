name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest

    # 测试连的是真的 MySQL 和 Redis，和本地 compose 起的那套一样，
    # 端口也一样，所以不用给测试额外设环境变量。
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: gateway
          MYSQL_USER: gateway
          MYSQL_PASSWORD: gateway
        ports:
          - 3306:3306
        options: >-
          --health-cmd "mysql -ugateway -pgateway -e 'SELECT 1' gateway"
          --health-interval 2s --health-timeout 3s --health-retries 30
      redis:
        image: redis:8-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 2s --health-timeout 3s --health-retries 15

    steps:
      - uses: actions/checkout@v5

      # 工具链版本只在 mise.toml 里写一次，CI 和本地装的是同一个。
      - uses: jdx/mise-action@v2

      - name: gofmt
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then echo "$unformatted"; exit 1; fi

      - run: go vet ./...

      - run: golangci-lint run

      - run: go test -race ./...

  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - run: docker build -t llm-gateway:ci .
