# 网关配置示例。密钥和数据库连接串都不写在这里，只写存放它们的环境变量名。
listen: ":8080"

# 管理端口：创建 Key、充值、禁用、查余额。只对内网开放即可。
admin:
  listen: ":8081"
  key_env: ADMIN_KEY

# 本地依赖由 docker compose up -d 提供，对应的连接串是：
#   export DATABASE_DSN='postgres://gateway:gateway@localhost:5432/gateway?sslmode=disable'
database:
  dsn_env: DATABASE_DSN

upstreams:
  # 本地 mock 上游：go run ./cmd/mockupstream
  - name: mock
    base_url: http://localhost:9090/v1
    key_env: MOCK_API_KEY
  # - name: deepseek
  #   base_url: https://api.deepseek.com/v1
  #   key_env: DEEPSEEK_API_KEY

models:
  - name: mock-model
    upstream: mock
  # - name: deepseek-chat
  #   upstream: deepseek
