# 网关配置示例。上游密钥不写在这里，只写存放它的环境变量名。
listen: ":8080"

upstreams:
  # 本地 mock 上游：go run ./cmd/mockupstream
  - name: mock
    base_url: http://localhost:9090/v1
    key_env: MOCK_API_KEY
  # - name: deepseek
  #   base_url: https://api.deepseek.com/v1
  #   key_env: DEEPSEEK_API_KEY

models:
  - name: mock-model
    upstream: mock
